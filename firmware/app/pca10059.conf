# Keep the stock Nordic nRF5 SDK USB bootloader and run Tester directly after the MBR.
CONFIG_BOOTLOADER_MCUBOOT=n
CONFIG_USE_DT_CODE_PARTITION=n

# Expose a stable USB serial-number descriptor derived from the nRF device identity.
CONFIG_HWINFO=y

# The USB CDC ACM transport carries binary BTP only.
CONFIG_UART_PIPE=y
CONFIG_UART_CONSOLE=n
CONFIG_CONSOLE=n
CONFIG_PRINTK=n
CONFIG_BOOT_BANNER=n
# Keep BTP as the only production transport; use a separate diagnostic build for logs.
CONFIG_TEST_LOGGING_DEFAULTS=n
CONFIG_LOG=n

# This controller does not provide the optional subrating capability.
CONFIG_BT_SUBRATING=n
