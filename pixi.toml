# nrftest 的跨平台开发环境清单：声明支持的 Host 平台和直接工具依赖。
# Pixi 将精确解析结果写入自动生成的 pixi.lock；本机路径和硬件信息不应写在这里。

[workspace]
authors = ["GuChangfeng <changfenggu81@gmail.com>"]
channels = ["conda-forge"]
name = "nrftest"
platforms = ["win-64", "osx-arm64", "linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
7zip = ">=26,<27"
cmake = ">=3.31,<5"
git = ">=2.51,<3"
gperf = ">=3.1,<4"
just = "==1.58.0"
ninja = ">=1.13,<2"
pytest = ">=9,<10"
python = "3.12.*"
ruff = ">=0.11,<1"

[target.osx-arm64.dependencies]
dtc = ">=1.7,<2"
socat = ">=1.7.3.2,<2"

[target.linux-64.dependencies]
dtc = ">=1.7,<2"
socat = ">=1.7.3.2,<2"

[target.win-64.dependencies]
vc14_runtime = ">=14.51.36247,<15"

[pypi-dependencies]
anytree = "*"
canopen = "*"
hidapi = "*"
intelhex = "*"
jsonschema = "*"
packaging = "*"
patool = ">=2"
psutil = ">=5.6.6"
pyelftools = ">=0.29"
pylink-square = "*"
pykwalify = "*"
pyserial = "*"
pyyaml = ">=6"
requests = ">=2.32.4"
reuse = ">=6"
semver = "*"
tqdm = ">=4.67.1"
west = ">=1.4,<2"

[target.win-64.pypi-dependencies]
pywin32 = "*"
windows-curses = ">=2.4"
